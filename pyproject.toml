[project]
name = "bistvalult-cli"
version = "0.1.0"
description = "Data fetchers for the bistValult research wiki"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.50",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["cli*"]

[tool.uv]
python-preference = "only-managed"
